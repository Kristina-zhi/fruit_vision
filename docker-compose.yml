services:
  postgres:
    image: postgres:15-alpine
    container_name: fruit-vision-postgres
    environment:
      - POSTGRES_DB=${PG_NAME:-fruit_recognition}
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fruit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fruit-vision-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_NAME=${PG_NAME:-fruit_recognition}
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-postgres}
      - ML_SERVER_URL=http://ml-service:8000
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET:-qBTmv4oX3kId1qYx2F5Ra8LfTg7ZwH0uN6Vc9bDsEjMAWpCr}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - fruit-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: fruit-vision-ml
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      - MODEL_PATH=${MODEL_PATH:-/app/best.pt}
      - BACKEND_FOLDER_PATH=/app/uploads
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.25}
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-10}
    volumes:
      - uploads_data:/app/uploads
      - ./ml-service/best.pt:/app/best.pt
    networks:
      - fruit-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fruit-vision-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - fruit-network
    depends_on:
      - postgres
    profiles:
      - dev
      - debug

networks:
  fruit-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  logs_data:
